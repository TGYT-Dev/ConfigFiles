# Enable SwayFX globally
swayfx_enable yes
swayfx_fade_duration 200
swayfx_shadow_fade_duration 150

# Center pop-in for Rofi / app launcher
for_window [class="Rofi"] {
    swayfx_enable yes
    swayfx_centered yes
    swayfx_scale_from_center yes
    swayfx_fade_duration 500
}

# Optional: dim inactive windows smoothly
swayfx_inactive_dim yes
swayfx_inactive_dim_duration 250

